<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Life Manager</title>
    <script>
      // Set the theme before React mounts and before any stylesheet paints, so a
      // dark-mode user never sees a flash of the light theme on load/reload.
      // In Electron, the preload script (which runs before this) exposes a
      // synchronous userData-backed read instead of localStorage - see
      // ThemeProvider.tsx for why localStorage can't be relied on there.
      (function () {
        var stored = window.electron && window.electron.isElectron
          ? window.electron.getInitialTheme()
          : localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (stored !== 'light' && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
